<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Экспорт данных - Настройки</title>
    <!-- Подключение иконок -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        /* Базовые стили, совпадающие с вашей формой регистрации */
        .main {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;

        }

        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            margin-top: 50px;
        }

        h2 {

            margin-top: 0;
            margin-bottom: 25px;
            text-align: center;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        /* Заголовки секций внутри формы */
        .section-title {
            display: block;
            margin-bottom: 12px;
            font-weight: bold;
            font-size: 16px;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }

        /* Стили для выбора строк (Radio buttons) */
        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-item {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 15px;
        }

        .option-item input {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #007bff; /* Цвет точки в тон бренда */
        }

        /* Стили для выбора столбцов (Checkboxes) */
        .checkbox-grid {
            display: grid;
            grid-template-columns: 1fr; /* В один столбец для мобильных, можно 1fr 1fr для десктопа */
            gap: 10px;
            padding: 10px 0;
        }

        /* Кнопка */
        .btn-export {
            background-color: #007bff;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: background-color 0.2s;
        }

        .btn-export:hover {
            background-color: #34495e;
        }

        .btn-export i {
            font-size: 18px;
        }

        /* Дополнительная подсказка */
        .hint {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 5px;
            display: block;
        }
    </style>
</head>
<body>
{% include 'LanguageLeap/header.html' %}
<div class="main">
<div class="container">
    <h2><i class="fas fa-file-download"></i> Экспорт слов</h2>

    <form action="#" method="GET">

        <!-- Секция выбора количества строк -->
        <div class="form-group">
            <span class="section-title">Количество строк</span>
            <div class="radio-group">
                <label class="option-item">
                    <input type="radio" name="rows" value="all" checked>
                    Все доступные строки
                </label>
                <label class="option-item">
                    <input type="radio" name="rows" value="new">
                    Только новые записи
                </label>
            </div>
            <span class="hint">Записи, которые еще не были экспортированы.</span>
        </div>

        <!-- Секция выбора столбцов -->
        <div class="form-group">
            <span class="section-title">Выбрать столбцы</span>
            <div class="checkbox-grid">
                <label class="option-item">
                    <input type="checkbox" name="col_date" checked> Дата добавления
                </label>
                <label class="option-item">
                    <input type="checkbox" name="col_text_name" checked> Название текста
                </label>
                <label class="option-item">
                    <input type="checkbox" name="col_word" checked> Слово
                </label>
                <label class="option-item">
                    <input type="checkbox" name="col_translation" checked> Перевод
                </label>
                <label class="option-item">
                    <input type="checkbox" name="col_example" checked> Пример
                </label>
                <label class="option-item">
                    <input type="checkbox" name="col_example_translation" checked> Перевод примера
                </label>
                <label class="option-item">
                    <input type="checkbox" name="col_definition" checked> Пояснение
                </label>
                <label class="option-item">
                    <input type="checkbox" name="col_definition_translation" checked> Перевод пояснения
                </label>
                <label class="option-item">
                    <input type="checkbox" name="col_synonyms" checked> Синонимы
                </label>
                <label class="option-item">
                    <input type="checkbox" name="col_antonyms" checked> Антонимы
                </label>

            </div>
        </div>

        <!-- Кнопка действия -->
        <button type="submit" class="btn-export">
            <i class="fas fa-file-excel"></i> Сформировать таблицу
        </button>

    </form>
</div>
</div>
{% include 'LanguageLeap/footer.html' %}
</body>
</html>
